name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
    # The docker-compose.yml bump below only ever lands via its own PR, so
    # ignore it here to avoid that merge re-triggering another bump PR.
    paths-ignore: [ 'docker-compose.yml' ]
  pull_request:
    branches: [ "main" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      # Pin docker-compose.yml's image tag to the version that was just
      # published, so Portainer/GitOps deploys that exact build instead of
      # tracking the mutable `latest` tag. Opens a PR rather than pushing to
      # main directly, so the bump still goes through review.
      - name: Determine the tag to pin docker-compose.yml to
        if: ${{ github.event_name == 'push' }}
        id: pin
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAGS: ${{ steps.meta.outputs.tags }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "${REF_TYPE}" = "tag" ]; then
            NEW_TAG=$(echo "${TAGS}" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          else
            NEW_TAG=$(echo "${TAGS}" | grep -oE 'sha-[0-9a-f]+$' | head -n1)
          fi
          if [ -z "${NEW_TAG}" ]; then
            echo "Could not determine which tag to pin docker-compose.yml to" >&2
            exit 1
          fi

          # Diff cleanly against main's tip regardless of which ref triggered
          # this run (a version tag may not be main's current HEAD).
          git fetch origin main --depth=1
          git checkout -B main origin/main

          sed -i -E "s#(image: ${IMAGE}:).*#\1${NEW_TAG}#" docker-compose.yml
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Open a PR to pin docker-compose.yml
        if: ${{ github.event_name == 'push' }}
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v7.0.5
        with:
          # The default GITHUB_TOKEN is blocked from opening PRs unless
          # "Allow GitHub Actions to create and approve pull requests" is
          # enabled under Settings > Actions > General. A repo-scoped PAT
          # in the optional GH_PAT secret isn't subject to that restriction,
          # so it takes priority when present.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore: pin docker-compose image to ${{ steps.pin.outputs.new_tag }}"
          title: "chore: pin docker-compose image to ${{ steps.pin.outputs.new_tag }}"
          body: |
            Automated update from `.github/workflows/docker-publish.yml` after
            publishing `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.pin.outputs.new_tag }}`.
          branch: bump-docker-compose-image
          delete-branch: true
          base: main
          add-paths: docker-compose.yml
